name: Debug User Email Mapping

on: 
  workflow_dispatch:
  push:

jobs:
  debug_mapping:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Dummy Data
        run: |
          # Directly set the variable without single quotes
          echo "PR_OWNER_USERNAME=username2_github" >> $GITHUB_ENV

      - name: Define user mappings
        run: |
          # Start with an empty JSON object
          USER_EMAIL_MAPPING_JSON='{'
          # Append each user-email pair
          USER_EMAIL_MAPPING_JSON+=' "github_username1": "email1@example.com",'
          USER_EMAIL_MAPPING_JSON+=' "username2_github": "email2@example.com",'
          USER_EMAIL_MAPPING_JSON+=' "username3_github": "email3@example.com",'
          # you can add members like this
          # USER_EMAIL_MAPPING_JSON+=' "john_smith": "email4@example.com",'
          
          # Close the JSON object
          USER_EMAIL_MAPPING_JSON+='"unknown": "unknown@example.com" }'
          echo "USER_EMAIL_MAPPING_JSON=$USER_EMAIL_MAPPING_JSON" >> $GITHUB_ENV
          echo "current USER_EMAIL_MAPPING_JSON=$USER_EMAIL_MAPPING_JSON"
      - name: Get usernames and map to emails
        env:
          USER_EMAIL_MAPPING_JSON: ${{ env.USER_EMAIL_MAPPING_JSON }}
          PR_OWNER_USERNAME: ${{ env.PR_OWNER_USERNAME }}
        run: |
          echo "Using USERNAME: $PR_OWNER_USERNAME"
          echo "JSON Mapping: $USER_EMAIL_MAPPING_JSON"
          # Use `jq` to extract the email, ensuring the variable is used correctly
          PR_OWNER_EMAIL=$(echo "$USER_EMAIL_MAPPING_JSON" | jq -r --arg username "$PR_OWNER_USERNAME" '.[$username]')
          echo "PR_OWNER_EMAIL=$PR_OWNER_EMAIL"
          
          if [[ -z "$PR_OWNER_EMAIL" ]]; then
            PR_OWNER_EMAIL="unknown@example.com"
          fi
          
          echo "Resolved PR Owner Email: $PR_OWNER_EMAIL"
